<div class="login-shell">
  @if (electron.isElectron) {
    <header class="login-titlebar">
      <span class="login-app-name">Desktop App</span>
      <div class="login-window-controls">
        <button type="button" class="login-window-control" aria-label="Réduire"
                title="Réduire" (click)="minimize()">
          <svg width="10" height="10" viewBox="0 0 10 10" aria-hidden="true">
            <path d="M0 5h10" stroke="currentColor" />
          </svg>
        </button>
        <button type="button" class="login-window-control login-window-control-close"
                aria-label="Fermer" title="Fermer" (click)="close()">
          <svg width="10" height="10" viewBox="0 0 10 10" aria-hidden="true">
            <path d="M0 0l10 10M10 0L0 10" stroke="currentColor" />
          </svg>
        </button>
      </div>
    </header>
  }

  <main class="login-main">
    <div class="login-card">
      <svg class="login-logo" width="40" height="40" viewBox="0 0 16 16" aria-hidden="true">
        <rect x="1" y="1" width="14" height="14" rx="3" fill="var(--vscode-accent)" />
        <path d="M4.5 8l2.5 2.5L11.5 5" fill="none" stroke="#ffffff" stroke-width="1.6" />
      </svg>
      <h1 class="login-title">Connexion</h1>
      <p class="login-subtitle">Connectez-vous pour ouvrir votre espace de travail.</p>

      <app-login-form
        [submitting]="submitting()"
        [error]="error()"
        (submitted)="onSubmit($event)" />
    </div>
  </main>
</div>
