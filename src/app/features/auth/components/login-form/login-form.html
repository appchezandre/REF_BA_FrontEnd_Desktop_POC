<form class="login-form" [formGroup]="form" (ngSubmit)="onSubmit()">
  <label class="login-field">
    <span class="login-label">Adresse e-mail</span>
    <input class="login-input" type="email" formControlName="email"
           autocomplete="username" spellcheck="false" />
    @if (form.controls.email.touched && form.controls.email.invalid) {
      <span class="login-field-error">
        @if (form.controls.email.hasError('required')) {
          L'adresse e-mail est requise.
        } @else {
          L'adresse e-mail est invalide.
        }
      </span>
    }
  </label>

  <label class="login-field">
    <span class="login-label">Mot de passe</span>
    <input class="login-input" type="password" formControlName="password"
           autocomplete="current-password" />
    @if (form.controls.password.touched && form.controls.password.hasError('required')) {
      <span class="login-field-error">Le mot de passe est requis.</span>
    }
  </label>

  @if (error(); as message) {
    <p class="login-error" role="alert">{{ message }}</p>
  }

  <div class="login-actions">
    @if (showCancel()) {
      <button class="login-cancel" type="button" (click)="cancelled.emit()">
        Annuler
      </button>
    }
    <button class="login-submit" type="submit" [disabled]="submitting()">
      {{ submitting() ? 'Connexion…' : submitLabel() }}
    </button>
  </div>
</form>
