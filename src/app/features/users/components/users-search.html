<div class="users-search">
  <label class="search-field">
    <span class="search-label">Recherche (tous les champs)</span>
    <input type="search" class="search-input" [value]="screen().searchText()"
           placeholder="Nom, e-mail, id…" aria-label="Recherche texte"
           (input)="onText($event)" />
  </label>

  <label class="search-field">
    <span class="search-label">E-mail</span>
    <input type="search" class="search-input" [value]="screen().searchEmail()"
           placeholder="prenom.nom@…" aria-label="Recherche par e-mail"
           (input)="onEmail($event)" />
  </label>

  <label class="search-field">
    <span class="search-label">Statut</span>
    <select class="search-input" [value]="screen().searchStatus()"
            aria-label="Filtrer par statut" (change)="onStatus($event)">
      <option value="all">Tous les statuts</option>
      @for (status of statuses; track status) {
        <option [value]="status" [selected]="status === screen().searchStatus()">
          {{ statusLabels[status] }}
        </option>
      }
    </select>
  </label>

  <fieldset class="search-range">
    <legend class="search-label">Créé entre (bornes incluses)</legend>
    <div class="search-range-row">
      <input type="date" class="search-input" [value]="screen().createdFrom()"
             aria-label="Date de création minimale" (input)="onCreatedFrom($event)" />
      <span class="search-range-sep">→</span>
      <input type="date" class="search-input" [value]="screen().createdTo()"
             aria-label="Date de création maximale" (input)="onCreatedTo($event)" />
    </div>
  </fieldset>

  <div class="search-footer">
    <span class="search-count">
      {{ screen().filteredUsers().length }} résultat(s)
    </span>
    <button type="button" class="search-clear" [disabled]="!screen().hasActiveSearch()"
            (click)="clear()">
      Effacer
    </button>
  </div>
</div>
