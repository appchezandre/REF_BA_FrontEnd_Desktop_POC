<footer class="status-bar" role="status" [class.detached]="isDetached()">
  <div class="status-side">
    <span class="status-item">{{ modeLabel() }}</span>
    <span class="status-item">{{ runtimeLabel() }}</span>
  </div>
  <div class="status-side">
    <span class="status-item">{{ store.totalTabCount() }} onglet(s)</span>
    <span class="status-item">{{ store.groups().length }} groupe(s)</span>
    @if (userLabel(); as user) {
      <span class="status-item">
        {{ user }}
        @if (stackedCount() > 0) {
          <span class="status-stack-badge"
                [title]="'Reviendra à ' + previousUserLabel()">+{{ stackedCount() }}</span>
        }
      </span>
      <button type="button" class="status-item status-button" (click)="switchUser()"
              title="Changer d'utilisateur : l'utilisateur actuel restera connecté, inactif">
        Changer d'utilisateur
      </button>
      <button type="button" class="status-item status-button" (click)="logout()"
              [title]="logoutTitle()">
        {{ logoutLabel() }}
      </button>
    }
  </div>
</footer>
